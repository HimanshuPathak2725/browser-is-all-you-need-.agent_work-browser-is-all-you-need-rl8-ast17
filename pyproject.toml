[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glm47-h100-posttraining"
version = "0.1.0"
description = "GLM-4.7-Flash SFT and GRPO on 8x NVIDIA H100 with Miles."
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.34",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "tokenizers>=0.22",
    "transformers>=4.57",
    "wandb>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
cleanroom-eval = [
    "modal>=1.5.0,<2",
]

[project.scripts]
aider-task-validator = "w8_biayn.aider_task_validator.cli_v2:main"
aider-task-specific-validator = "w8_biayn.aider_task_validator.task_specific_cli:main"

[tool.hatch.build]
exclude = [
    "/.*",
    "/wandb",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glm47_posttraining", "src/w8_biayn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
